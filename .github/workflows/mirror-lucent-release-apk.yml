name: Mirror Lucent release APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  mirror-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release manifest
        uses: actions/checkout@v4

      - name: Resolve the release asset
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          asset="lucent-unified-${version}.apk"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: Download the exact signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo tyler-bam-ai/pegasus-lucent \
            --pattern "${RELEASE_ASSET}.part-*"
          parts=( "${RELEASE_ASSET}".part-* )
          test -e "${parts[0]}"
          cat "${parts[@]}" > "$RELEASE_ASSET"

      - name: Verify the signed build
        env:
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        run: |
          expected_sha="$(jq -r '.companionSha256' release-manifest.json)"
          echo "${expected_sha}  ${RELEASE_ASSET}" | sha256sum --check

      - name: Attach APK to this release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        run: gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" --clobber --repo "${{ github.repository }}"
