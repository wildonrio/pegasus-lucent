name: Mirror Lucent release APK

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - .github/workflows/mirror-lucent-release-apk.yml

permissions:
  contents: write

jobs:
  mirror-apk:
    if: github.event_name == 'push' || github.event.release.tag_name == 'v3.0.37'
    runs-on: ubuntu-latest
    steps:
      - name: Download the exact signed APK
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            --output lucent-unified-3.0.37.apk \
            https://github.com/tyler-bam-ai/pegasus-lucent/releases/download/v3.0.37/lucent-unified-3.0.37.apk

      - name: Verify the signed build
        run: |
          echo "d3a5a4ff83d0b15872429fd8bad014d7965b23b108aa351979fc8554c59c90d9  lucent-unified-3.0.37.apk" | sha256sum --check

      - name: Attach APK to this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v3.0.37 lucent-unified-3.0.37.apk --clobber --repo "${{ github.repository }}"
