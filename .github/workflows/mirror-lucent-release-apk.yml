name: Mirror Lucent release APK

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - .github/workflows/mirror-lucent-release-apk.yml

permissions:
  contents: write

jobs:
  mirror-apk:
    if: github.event_name == 'push' || github.event.release.tag_name == 'v3.0.36'
    runs-on: ubuntu-latest
    steps:
      - name: Download the exact signed APK
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            --output lucent-unified-3.0.36.apk \
            https://github.com/tyler-bam-ai/pegasus-lucent/releases/download/v3.0.36/lucent-unified-3.0.36.apk

      - name: Verify the signed build
        run: |
          echo "5d49c13036b52ae3f2a4ceaa90e827347450007d79daa8281ac0cf0cf807bf94  lucent-unified-3.0.36.apk" | sha256sum --check

      - name: Attach APK to this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v3.0.36 lucent-unified-3.0.36.apk --clobber --repo "${{ github.repository }}"
